<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClauseAI – Legal Contract Query Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: 300;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.active {
            border-color: #764ba2;
            background: #eef0ff;
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: 500;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .results-section {
            grid-column: 1 / -1;
        }

        .result-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .result-item h3 {
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        .excerpt {
            color: #555;
            margin: 10px 0;
            line-height: 1.6;
            font-style: italic;
        }

        .summary {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #764ba2;
        }

        .summary h3 {
            color: #333;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .highlights {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .highlight-tag {
            background: #e3e7ff;
            color: #667eea;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-info {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 20px;
            }
        }

        .relevant-clauses {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }

        .relevant-clauses h4 {
            color: #333;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .clause-list {
            list-style: none;
        }

        .clause-list li {
            padding: 8px 0;
            color: #555;
            font-size: 0.9rem;
        }

        .clause-list li:before {
            content: "▸ ";
            color: #667eea;
            font-weight: bold;
            margin-right: 5px;
        }

        .expanded-query {
            background: #f0f2ff;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #333;
            font-size: 0.9rem;
            border-left: 3px solid #667eea;
        }

        .expanded-query label {
            display: inline;
            color: #667eea;
            font-weight: 600;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚖️ ClauseAI</h1>
            <p>Professional Legal Contract Query Service</p>
        </header>

        <div class="main-grid">
            <!-- Upload Section -->
            <div class="card">
                <h2>📤 Upload Clauses</h2>
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".json" />
                    <div class="upload-icon">📄</div>
                    <div class="upload-text">Click to upload or drag and drop</div>
                    <div class="upload-hint">JSON file with clauses</div>
                </div>
                <div id="uploadStatus"></div>
            </div>

            <!-- Query Section -->
            <div class="card">
                <h2>🔍 Ask a Question</h2>
                <form id="queryForm">
                    <div class="form-group">
                        <label for="question">Your Question</label>
                        <textarea id="question" placeholder="e.g., What are the payment terms?" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="topK">Number of Results</label>
                        <input type="number" id="topK" value="3" min="1" max="10" />
                    </div>
                    <button type="submit" id="queryBtn">Search Clauses</button>
                    <div id="queryStatus"></div>
                </form>
            </div>

            <!-- Results Section -->
            <div class="card results-section">
                <h2>📋 Results</h2>
                <div id="results">
                    <p style="color: #999; text-align: center; padding: 40px;">Upload clauses and ask a question to see results</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let fileUploaded = false;

        // ========== FILE UPLOAD HANDLING ==========
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadStatus = document.getElementById('uploadStatus');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('active');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('active');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('active');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                handleFileUpload();
            }
        });

        fileInput.addEventListener('change', handleFileUpload);

        async function handleFileUpload() {
            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            uploadStatus.innerHTML = '<div class="status loading"><span class="spinner"></span>Uploading...</div>';

            try {
                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Upload failed');
                }

                const data = await response.json();
                uploadStatus.innerHTML = `<div class="status success">✅ ${data.clauses} clauses uploaded successfully!</div>`;
                fileUploaded = true;
            } catch (error) {
                uploadStatus.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
                fileUploaded = false;
            }
        }

        // ========== QUERY HANDLING ==========
        const queryForm = document.getElementById('queryForm');
        const questionInput = document.getElementById('question');
        const topKInput = document.getElementById('topK');
        const queryStatus = document.getElementById('queryStatus');
        const queryBtn = document.getElementById('queryBtn');
        const resultsDiv = document.getElementById('results');

        queryForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!fileUploaded) {
                queryStatus.innerHTML = '<div class="status error">❌ Please upload clauses first</div>';
                return;
            }

            const question = questionInput.value.trim();
            if (!question) {
                queryStatus.innerHTML = '<div class="status error">❌ Please enter a question</div>';
                return;
            }

            const formData = new FormData();
            formData.append('question', question);
            formData.append('k', topKInput.value);

            queryBtn.disabled = true;
            queryStatus.innerHTML = '<div class="status loading"><span class="spinner"></span>Searching...</div>';

            try {
                const response = await fetch(`${API_URL}/ask`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Query failed');
                }

                const data = await response.json();
                displayResults(data);
                queryStatus.innerHTML = '<div class="status success">✅ Results loaded</div>';
            } catch (error) {
                queryStatus.innerHTML = `<div class="status error">❌ Error: ${error.message}</div>`;
            } finally {
                queryBtn.disabled = false;
            }
        });

        function displayResults(data) {
            let html = '';

            // Expanded Query
            html += `
                <div class="expanded-query">
                    <label>Expanded Query:</label>
                    ${data.expanded_query}
                </div>
            `;

            // Summary
            if (data.answer && data.answer.summary) {
                html += `
                    <div class="summary">
                        <h3>📝 Summary</h3>
                        <p>${data.answer.summary}</p>
                        ${data.answer.highlights && data.answer.highlights.length > 0 ? `
                            <div class="highlights">
                                ${data.answer.highlights.map(h => `<span class="highlight-tag">${escapeHtml(h)}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }

            // Top Clauses
            if (data.top_clauses && data.top_clauses.length > 0) {
                html += '<h3 style="margin-top: 25px; margin-bottom: 15px; color: #333;">📌 Top Matching Clauses</h3>';
                data.top_clauses.forEach((clause, index) => {
                    html += `
                        <div class="result-item">
                            <h3>Clause ${clause.id || index + 1} <span class="score">${(clause.similarity * 100).toFixed(0)}% Match</span></h3>
                            <div class="excerpt">${escapeHtml(clause.text)}</div>
                        </div>
                    `;
                });
            }

            // Relevant Clauses from Answer
            if (data.answer && data.answer.relevant_clauses && data.answer.relevant_clauses.length > 0) {
                html += `
                    <div class="relevant-clauses">
                        <h4>🎯 Key Excerpts:</h4>
                        <ul class="clause-list">
                            ${data.answer.relevant_clauses.map(c => `<li>${escapeHtml(c.excerpt || '')}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }

            resultsDiv.innerHTML = html;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
